# llm-ferry observability — Grafana unified alerting: contact points (apiVersion 1)
# Grafana 13.2.0. Routes every alert (via policies.yml) to the ferry-webhook contact point.
#
# Webhook token handling (CONTRACT.md "Webhook"): this file is COMMITTED with the literal
# ${FERRY_ALERT_WEBHOOK} token intact — the real webhook URL is NEVER committed. bringup.sh
# materializes a RUNTIME copy of the whole provisioning tree into
# ~/.config/ferry/observ/grafana-provisioning/ via envsubst (same pattern as the g0vs1g desk
# stack) and launches Grafana pointed there — never at this repo tree directly with the token
# unexpanded. The token is OPTIONAL: if FERRY_ALERT_WEBHOOK is unset at bringup time,
# bringup.sh defaults it to an inert local sink URL (http://127.0.0.1:9092/ferry-alert-noop)
# — NOT an empty string, because Grafana 13.2.0 rejects an empty webhook url as a fatal
# provisioning error and refuses to boot. With the sink default the contact point provisions
# cleanly, webhook delivery no-ops (only ever POSTed on a real alert fire), and every alert
# still shows in the Grafana UI (Alerting > Alert rules / Firing).
apiVersion: 1

contactPoints:
  - orgId: 1
    name: ferry-webhook
    receivers:
      - uid: ferry-webhook-receiver
        type: webhook
        settings:
          # Literal token — envsubst-expanded at bringup time. Never a real URL here.
          url: ${FERRY_ALERT_WEBHOOK}
          httpMethod: POST
        disableResolveMessage: false
