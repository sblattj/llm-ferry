# llm-ferry observability — Grafana unified alerting: alert rules (apiVersion 1)
# Grafana 13.2.0. All rules query datasource uid "ferry-vm" (fixed contract, CONTRACT.md
# "Grafana datasource UID") and route to the "ferry-webhook" contact point via policies.yml.
# Metric names/thresholds match CONTRACT.md's "Metric contract" section exactly.
#
# Query pattern (Grafana's standard three-step query→reduce→threshold, used by every rule below):
#   A - an instant Prometheus query against ferry-vm (raw or computed metric value, 10m lookback
#       window so range functions like rate()/increase() over a shorter window always have data)
#   B - a "reduce" expression (reducer: last) collapsing A's window to a single value per series
#   C - a "threshold" expression evaluating B against the rule's condition; C is the `condition`
# Series labels (e.g. `client`, `status`, `kind`) flow through B and C unchanged, so a query that
# returns multiple series fires one alert instance per breaching series/label combination.
#
# None of the 9 rules below need the `>= bool` / `> bool` PromQL workaround (Grafana's classic
# threshold evaluator has no native gte/lte) — every threshold here is a strict > or < , both of
# which the threshold step supports directly (gt/lt).
#
# Rules 8-9 query litellm-native metrics (litellm_deployment_successful_fallbacks_total,
# litellm_deployment_cooled_down_total) scraped by VM directly from litellm's own :8090/metrics,
# not emitted by our exporter — see CONTRACT.md's "litellm-native" section. These metrics ship
# enabled by default, unlike the rest of that section's opt-in panels.
apiVersion: 1

groups:
  - orgId: 1
    name: ferry-alerts
    folder: Ferry Alerts
    interval: 1m
    rules:
      # 1. Ferry down — critical. ferry_up is always emitted as 0 or 1 by a healthy exporter
      # (CONTRACT.md: "still emit ferry_exporter_up 1 + ferry_up 0 ... never 500"), so a true
      # absence of this series means the exporter itself is unreachable — that case is covered
      # by "Exporter down" below, so noDataState here stays NoData (don't double-fire).
      - uid: ferry-down
        title: "Ferry down"
        condition: C
        data:
          - refId: A
            queryType: ""
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: ferry-vm
            model:
              refId: A
              editorMode: code
              expr: ferry_up
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              datasource:
                type: prometheus
                uid: ferry-vm
          - refId: B
            queryType: ""
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              datasource:
                type: __expr__
                uid: __expr__
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            queryType: ""
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 1
                  operator:
                    type: and
                  query:
                    params: []
                  reducer:
                    type: last
                    params: []
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              intervalMs: 1000
              maxDataPoints: 43200
        noDataState: NoData
        execErrState: Alerting
        for: 2m
        isPaused: false
        labels:
          severity: critical
        annotations:
          summary: "ferry_up == 0 (metric: ferry_up, threshold: < 1) — litellm's /health/liveliness check is failing; the relay is down or unreachable."

      # 2. Exporter down — critical. ferry_exporter_up is a meta gauge always set to 1 by a
      # running exporter, so "== 0" never legitimately happens; the real failure mode is the
      # whole series going ABSENT (the exporter process is down or the VM scrape target is
      # unreachable) — noDataState: Alerting treats that absence as a firing alert too, per the
      # standard "no data / == 0" pattern.
      - uid: ferry-exporter-down
        title: "Exporter down"
        condition: C
        data:
          - refId: A
            queryType: ""
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: ferry-vm
            model:
              refId: A
              editorMode: code
              expr: ferry_exporter_up
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              datasource:
                type: prometheus
                uid: ferry-vm
          - refId: B
            queryType: ""
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              datasource:
                type: __expr__
                uid: __expr__
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            queryType: ""
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 1
                  operator:
                    type: and
                  query:
                    params: []
                  reducer:
                    type: last
                    params: []
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              intervalMs: 1000
              maxDataPoints: 43200
        # A missing series (scrape target unreachable, exporter process down) is treated as the
        # alert firing too, so "absent" is covered by noDataState, not just the "== 0" threshold.
        noDataState: Alerting
        execErrState: Alerting
        for: 2m
        isPaused: false
        labels:
          severity: critical
        annotations:
          summary: "ferry_exporter_up == 0 (or absent) — metric: ferry_exporter_up, threshold: < 1 — the ferry-metrics-exporter target is down or unreachable by VictoriaMetrics."

      # 3. High error rate — warning. clamp_min on the denominator avoids a 0/0 NaN when there is
      # no traffic in the window at all (that quiet-period case correctly yields 0, not a firing
      # alert).
      - uid: ferry-high-error-rate
        title: "High error rate"
        condition: C
        data:
          - refId: A
            queryType: ""
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: ferry-vm
            model:
              refId: A
              editorMode: code
              expr: 100 * sum(rate(ferry_requests_total{status=~"[45].."}[5m])) / clamp_min(sum(rate(ferry_requests_total[5m])), 0.0001)
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              datasource:
                type: prometheus
                uid: ferry-vm
          - refId: B
            queryType: ""
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              datasource:
                type: __expr__
                uid: __expr__
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            queryType: ""
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 10
                  operator:
                    type: and
                  query:
                    params: []
                  reducer:
                    type: last
                    params: []
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              intervalMs: 1000
              maxDataPoints: 43200
        noDataState: NoData
        execErrState: Alerting
        for: 5m
        isPaused: false
        labels:
          severity: warning
        annotations:
          summary: "5xx/4xx share of ferry_requests_total over the last 5m > 10% (metric: 100 * sum(rate(ferry_requests_total{status=~\"[45]..\"}[5m])) / sum(rate(ferry_requests_total[5m])), threshold: > 10). Current: {{ $values.B.Value }}%."

      # 4. Backend rate-limit storm — warning. increase() over the trailing 10m; fires
      # immediately (no debounce window — a burst of rate-limit events is itself the signal).
      - uid: ferry-ratelimit-storm
        title: "Backend rate-limit storm"
        condition: C
        data:
          - refId: A
            queryType: ""
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: ferry-vm
            model:
              refId: A
              editorMode: code
              expr: increase(ferry_backend_events_total{kind="rate_limited"}[10m])
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              datasource:
                type: prometheus
                uid: ferry-vm
          - refId: B
            queryType: ""
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              datasource:
                type: __expr__
                uid: __expr__
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            queryType: ""
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 5
                  operator:
                    type: and
                  query:
                    params: []
                  reducer:
                    type: last
                    params: []
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              intervalMs: 1000
              maxDataPoints: 43200
        noDataState: NoData
        execErrState: Alerting
        for: 0s
        isPaused: false
        labels:
          severity: warning
        annotations:
          summary: "increase(ferry_backend_events_total{kind=\"rate_limited\"}[10m]) > 5 — {{ $values.B.Value }} rate-limit event(s) from the backend in the last 10m."

      # 5. Backend quota exhausted — warning. Any occurrence in the trailing 15m is the
      # signal; fires immediately, same rationale as rule 4 (a discrete backend event, not
      # a noisy continuous metric that needs debouncing). Vendor-neutral since 2026-09-04
      # (was "Kimi quota exhausted" / kind="kimi_quota" — Kimi is retired and the kind is
      # now lib/ferry_live.classify_log_line's quota_exhausted, whichever vendor triggers it).
      - uid: ferry-quota-exhausted
        title: "Backend quota exhausted"
        condition: C
        data:
          - refId: A
            queryType: ""
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: ferry-vm
            model:
              refId: A
              editorMode: code
              expr: increase(ferry_backend_events_total{kind="quota_exhausted"}[15m])
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              datasource:
                type: prometheus
                uid: ferry-vm
          - refId: B
            queryType: ""
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              datasource:
                type: __expr__
                uid: __expr__
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            queryType: ""
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0
                  operator:
                    type: and
                  query:
                    params: []
                  reducer:
                    type: last
                    params: []
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              intervalMs: 1000
              maxDataPoints: 43200
        noDataState: NoData
        execErrState: Alerting
        for: 0s
        isPaused: false
        labels:
          severity: warning
        annotations:
          summary: "increase(ferry_backend_events_total{kind=\"quota_exhausted\"}[15m]) > 0 — a quota_exhausted backend event fired in the last 15m. Current: {{ $values.B.Value }}."

      # 6. Key pool shrank — warning. A pool that HAD several deployments and now has
      # fewer than 2 has lost its headroom for a rotation/outage.
      #
      # `< 2` on its own was wrong, and provably so: a config with no pooled model_name
      # at all pins ferry_worker_pool_size (the max group size) at 1, so the rule had no
      # non-firing state to return to. Verified firing continuously on 2026-08-29 against
      # a 19-deployment config in which every model_name is a single deployment — it was
      # reporting the absence of a feature as the failure of one.
      #
      # The second factor is what makes it a SHRANK test: it requires a pool to have
      # existed in the last 24h. Both comparisons use `bool` so every series is kept and
      # mapped to 1/0 — a bare `<` would FILTER, and a filtered-away series reads as
      # NoData rather than as "not breaching". Threshold is `gt 0` because the product is
      # 1 only when both halves hold; note the evaluator set has no `gte`, which is the
      # other reason the comparison lives in the query.
      #
      # Re-pointed at ferry_pool_size{hop} (2026-08-30). The interim fix above used the
      # GLOBAL max across every model_name, which could only ever say "some pool
      # somewhere shrank"; the per-hop series says WHICH, and the `hop` label now rides
      # through to the alert instance. `ferry_worker_pool_size` still exists and still
      # means the largest pool — ferry-backends.json panel 1 reads it — it is simply the
      # wrong series to alert on.
      - uid: ferry-key-pool-shrank
        title: "Key pool shrank"
        condition: C
        data:
          - refId: A
            queryType: ""
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: ferry-vm
            model:
              refId: A
              editorMode: code
              expr: (ferry_pool_size < bool 2) * (max_over_time(ferry_pool_size[24h]) >= bool 2)
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              datasource:
                type: prometheus
                uid: ferry-vm
          - refId: B
            queryType: ""
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              datasource:
                type: __expr__
                uid: __expr__
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            queryType: ""
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0
                  operator:
                    type: and
                  query:
                    params: []
                  reducer:
                    type: last
                    params: []
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              intervalMs: 1000
              maxDataPoints: 43200
        noDataState: NoData
        execErrState: Alerting
        for: 10m
        isPaused: false
        labels:
          severity: warning
        annotations:
          summary: "Hop {{ $labels.hop }}: a pooled model_name that had 2+ deployments in the last 24h now has fewer than 2 — it has lost its rotation headroom and litellm has nothing left to balance across. Breach flag: {{ $values.B.Value }} (1 = shrank; B is the 1/0 product, NOT the pool size — read ferry_pool_size{hop=\"{{ $labels.hop }}\"} for that)."

      # 7. Health-check latency high — warning. The passive round-trip to /health/liveliness
      # (no token spend) is degraded.
      - uid: ferry-health-check-latency-high
        title: "Health-check latency high"
        condition: C
        data:
          - refId: A
            queryType: ""
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: ferry-vm
            model:
              refId: A
              editorMode: code
              expr: ferry_health_check_latency_ms
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              datasource:
                type: prometheus
                uid: ferry-vm
          - refId: B
            queryType: ""
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              datasource:
                type: __expr__
                uid: __expr__
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            queryType: ""
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 2000
                  operator:
                    type: and
                  query:
                    params: []
                  reducer:
                    type: last
                    params: []
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              intervalMs: 1000
              maxDataPoints: 43200
        noDataState: NoData
        execErrState: Alerting
        for: 5m
        isPaused: false
        labels:
          severity: warning
        annotations:
          summary: "ferry_health_check_latency_ms > 2000 (metric: ferry_health_check_latency_ms, threshold: > 2000ms) — the /health/liveliness round-trip is degraded. Current: {{ $values.B.Value }}ms."

      # 8. Orchestrator fallback fired — warning. litellm-native counter, labeled per
      # requested_model→fallback_model pair; summed across all pairs here (any fallback hop is
      # the signal). Any occurrence in the trailing 5m fires immediately — same discrete-event
      # rationale as rules 4/5 (a fallback hop is itself the alert-worthy fact, not a rate to
      # debounce). Inspect the requested_model/fallback_model labels on
      # litellm_deployment_successful_fallbacks_total in Explore to see which chain fired.
      - uid: ferry-orchestrator-fallback
        title: "Orchestrator fallback fired"
        condition: C
        data:
          - refId: A
            queryType: ""
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: ferry-vm
            model:
              refId: A
              editorMode: code
              expr: sum(increase(litellm_deployment_successful_fallbacks_total[5m]))
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              datasource:
                type: prometheus
                uid: ferry-vm
          - refId: B
            queryType: ""
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              datasource:
                type: __expr__
                uid: __expr__
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            queryType: ""
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0
                  operator:
                    type: and
                  query:
                    params: []
                  reducer:
                    type: last
                    params: []
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              intervalMs: 1000
              maxDataPoints: 43200
        noDataState: NoData
        execErrState: Alerting
        for: 0s
        isPaused: false
        labels:
          severity: warning
        annotations:
          summary: "sum(increase(litellm_deployment_successful_fallbacks_total[5m])) > 0 — {{ $values.B.Value }} fallback hop(s) were served in the last 5m because a primary deployment failed (requested_model→fallback_model — check litellm_deployment_successful_fallbacks_total's labels in Explore for which chain fired)."

      # 9. Deployment cooled down — warning. litellm-native counter: a backend was pulled out of
      # rotation (e.g. a 429/quota exception tripped its cooldown window). Any occurrence in the
      # trailing 5m fires immediately, same discrete-event rationale as rule 8.
      - uid: ferry-deployment-cooled-down
        title: "Deployment cooled down"
        condition: C
        data:
          - refId: A
            queryType: ""
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: ferry-vm
            model:
              refId: A
              editorMode: code
              expr: sum(increase(litellm_deployment_cooled_down_total[5m]))
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              datasource:
                type: prometheus
                uid: ferry-vm
          - refId: B
            queryType: ""
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              datasource:
                type: __expr__
                uid: __expr__
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            queryType: ""
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0
                  operator:
                    type: and
                  query:
                    params: []
                  reducer:
                    type: last
                    params: []
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              intervalMs: 1000
              maxDataPoints: 43200
        noDataState: NoData
        execErrState: Alerting
        for: 0s
        isPaused: false
        labels:
          severity: warning
        annotations:
          summary: "sum(increase(litellm_deployment_cooled_down_total[5m])) > 0 — {{ $values.B.Value }} deployment cooldown event(s) in the last 5m (a backend was pulled out of rotation, e.g. on a 429/quota exception — check litellm_deployment_cooled_down_total's litellm_model_name/model_id/exception_status labels in Explore for which one)."

      # 10. Deployment quota exhausted — warning. From the front-door event tap, not the
      # proxy log: the log carries no model at all, so this is a fact nothing else in the
      # stack can report. The classifier table that separates a quota from a rate limit is
      # the OPERATOR's (~/.config/ferry/event-rules.json); with no table every failure
      # classifies as `unknown` and this rule simply never fires — visible, never silently
      # green.
      #
      # noDataState is OK, not NoData, and that is the whole design of this series:
      # ferry_deployment_state emits ONLY the state a deployment is in right now, so
      # "nothing is exhausted" is an EMPTY result, not a zero. NoData here would page on
      # every healthy scrape. The exporter being gone is covered by "Exporter down".
      #
      # No `bool` and no `>=`: the series is 1 exactly when it exists, so `gt 0` on the
      # raw value is already the right test.
      - uid: ferry-deployment-quota-exhausted
        title: "Deployment quota exhausted"
        condition: C
        data:
          - refId: A
            queryType: ""
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: ferry-vm
            model:
              refId: A
              editorMode: code
              expr: max by (deployment) (ferry_deployment_state{state="quota_exhausted"})
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              datasource:
                type: prometheus
                uid: ferry-vm
          - refId: B
            queryType: ""
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              datasource:
                type: __expr__
                uid: __expr__
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            queryType: ""
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0
                  operator:
                    type: and
                  query:
                    params: []
                  reducer:
                    type: last
                    params: []
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              intervalMs: 1000
              maxDataPoints: 43200
        noDataState: OK
        execErrState: Alerting
        for: 5m
        isPaused: false
        labels:
          severity: warning
        annotations:
          summary: "Deployment {{ $labels.deployment }} is out of quota — a provider refused it with wording the operator's classifier table maps to quota_exhausted, not to an ordinary rate limit. This state is STICKY: only a success on that same deployment clears it, because a weekly limit does not come back on a timer. Traffic is still being served if the lane has a fallback left — check \"Lane chain exhausted\" for whether it does."

      # 11. Lane chain exhausted — critical. THE outage condition this stack could not
      # express before: not "a backend is down" but "this lane has run out of backends".
      #
      # The join. The left count is the deployments of a lane that currently hold a
      # NON-healthy state; the right count is every deployment configured in that lane.
      # Equal means all of them. `max by (lane,deployment)` collapses a deployment that
      # appears at two positions of one chain so it is not counted twice.
      #
      # `deployment!="unknown"` drops hops whose litellm.yaml set no model_info.id: an
      # event can never be joined to them, so their health is unknowable and including
      # them would make the counts disagree forever.
      #
      # A deployment traffic has never touched has NO state series at all, so it lands in
      # the right count and not the left, and the rule stays quiet. That is deliberate and
      # conservative: this fires only when the whole chain has actually been tried and
      # every hop failed.
      #
      # The `==` is deliberately NOT `== bool`: it FILTERS to the breaching lanes, one
      # alert instance each with the `lane` label intact, and the value carried through to
      # {{ $values.B.Value }} is the number of dead hops. A non-breaching lane vanishing
      # from the result is exactly right here, and an all-healthy stack returns nothing at
      # all — hence noDataState: OK, same reasoning as rule 10.
      - uid: ferry-lane-chain-exhausted
        title: "Lane chain exhausted"
        condition: C
        data:
          - refId: A
            queryType: ""
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: ferry-vm
            model:
              refId: A
              editorMode: code
              expr: count by (lane) (max by (lane,deployment) (ferry_lane_hop{deployment!="unknown"}) and on(deployment) (ferry_deployment_state{state!="healthy"})) == count by (lane) (max by (lane,deployment) (ferry_lane_hop{deployment!="unknown"}))
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              datasource:
                type: prometheus
                uid: ferry-vm
          - refId: B
            queryType: ""
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              datasource:
                type: __expr__
                uid: __expr__
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            queryType: ""
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0
                  operator:
                    type: and
                  query:
                    params: []
                  reducer:
                    type: last
                    params: []
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              intervalMs: 1000
              maxDataPoints: 43200
        noDataState: OK
        execErrState: Alerting
        for: 2m
        isPaused: false
        labels:
          severity: critical
        annotations:
          summary: "Lane {{ $labels.lane }} has NO healthy hop left — every deployment in its chain ({{ $values.B.Value }} of them) is in a non-healthy state at the same time. This is a total outage of that lane: the next request walks the whole chain and fails. The \"Deployment health\" table on the Ferry — Lanes dashboard names which backends and why."

      # 12. Pool member lost — warning. Deliberately partitioned against "Key pool
      # shrank" above so one config edit cannot fire both: this rule requires the hop to
      # STILL have 2+ deployments (3 -> 2), and that rule requires it to have dropped
      # BELOW 2 (2 -> 1). Overlapping alerts on one event are how an alert set stops being
      # read.
      #
      # Both comparisons use `bool` so every hop's series survives as 1/0 — a bare `<`
      # would filter, and a filtered-away hop reads as NoData rather than as "not
      # breaching". The evaluator set has no `gte`, which is the other reason `>= 2` lives
      # in the query rather than in the threshold.
      #
      # noDataState is NoData here, unlike rules 10-11: ferry_pool_size is emitted for
      # every hop on every scrape whether or not anything is wrong, so its absence really
      # does mean the exporter or the config parse is gone, not that all is well.
      - uid: ferry-pool-member-lost
        title: "Pool member lost"
        condition: C
        data:
          - refId: A
            queryType: ""
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: ferry-vm
            model:
              refId: A
              editorMode: code
              expr: (ferry_pool_size < bool max_over_time(ferry_pool_size[24h])) * (ferry_pool_size >= bool 2)
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              datasource:
                type: prometheus
                uid: ferry-vm
          - refId: B
            queryType: ""
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              datasource:
                type: __expr__
                uid: __expr__
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            queryType: ""
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0
                  operator:
                    type: and
                  query:
                    params: []
                  reducer:
                    type: last
                    params: []
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              intervalMs: 1000
              maxDataPoints: 43200
        noDataState: NoData
        execErrState: Alerting
        for: 10m
        isPaused: false
        labels:
          severity: warning
        annotations:
          summary: "Hop {{ $labels.hop }} has fewer deployments than it had in the last 24h, but still has 2 or more — a pool member was removed from litellm.yaml or its model_name changed. Rotation still works; it has less headroom. Read ferry_pool_size{hop=\"{{ $labels.hop }}\"} for the current size and the Pools panel for the whole set."
