# ferry observability stack — VictoriaMetrics promscrape config.
#
# VictoriaMetrics (ferry, :8429) reads this at start via -promscrape.config=. Host processes
# over loopback (no compose DNS) — see observ/bringup.sh. Ports per CONTRACT.md:
#   ferry-exporter 9092  ·  litellm proxy 8090 (native /metrics, on by default).
#
# NB: only METRICS are scraped here. Logs go to VictoriaLogs (:9428) and are PUSHED
# in by the ferry-log-shipper daemon — VictoriaLogs has no scrape config at all.
# Owned by the "bringup" seat.

global:
  scrape_interval: 15s

scrape_configs:
  # The ferry-metrics-exporter — the primary source. Emits every ferry_* series
  # (health, traffic counters, topology) parsed from the proxy log + litellm liveliness.
  - job_name: "ferry-exporter"
    static_configs:
      - targets: ["127.0.0.1:9092"]

  # litellm-native metrics — enrichment served by litellm itself, NOT by our exporter.
  # ON BY DEFAULT as of the current ferry: the litellm.yaml template (and the live
  # config) set callbacks: ["prometheus"], and `ferry install` bundles the
  # prometheus_client dependency, so /metrics serves rather than 404s out of the box.
  # If a hand-edited config drops that callback, VM tolerates the target being down —
  # the scrape fails harmlessly, no litellm_* series exist, and the ferry-backends
  # "LLM internals" row falls back to "No data". Never make a ferry_* panel depend on it.
  - job_name: "litellm"
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:8090"]
