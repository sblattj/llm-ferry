# ferry observability stack — VictoriaMetrics promscrape config.
#
# VictoriaMetrics (ferry, :8429) reads this at start via -promscrape.config=. Host processes
# over loopback (no compose DNS) — see observ/bringup.sh. Ports per CONTRACT.md:
#   ferry-exporter 9092  ·  litellm proxy 8090 (opt-in native /metrics).
# Owned by the "bringup" seat.

global:
  scrape_interval: 15s

scrape_configs:
  # The ferry-metrics-exporter — the primary source. Emits every ferry_* series
  # (health, traffic counters, topology) parsed from the proxy log + litellm liveliness.
  - job_name: "ferry-exporter"
    static_configs:
      - targets: ["127.0.0.1:9092"]

  # litellm-native metrics — OPT-IN enrichment, NOT emitted by our exporter.
  # Off by default: litellm's /metrics is 404 until the user enables the prometheus
  # callback (see observ/README.md "Enable litellm-native metrics"). VM tolerates the
  # target being down — the scrape just fails harmlessly and no litellm_* series exist,
  # so the ferry-backends "LLM internals" row shows "No data" until it is enabled.
  - job_name: "litellm"
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:8090"]
