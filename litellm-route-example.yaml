# litellm-route-example.yaml — template for `ferry up`
# ---------------------------------------------------------------------------
# THE FERRY STACK — several named LANES on one OpenAI-compatible endpoint, so
# LAN clients (or localhost) get a big driving model, two Gemini worker lanes,
# and the host's own GPU models — all from one URL, with every credential
# staying on the host.
#
# A lane NAME is the contract clients bind to. The model behind a lane is
# swappable HERE without touching a single client config, which is the whole
# reason the names are roles (`heavy`, `flash`) and not model ids.
#
#   heavy             -> DRIVER: the big planning/driving model, via a ChatGPT
#                        SUBSCRIPTION (example: GPT-5.6 Sol). ONE deployment,
#                        NO fallback chain — a driver that fails must ERROR,
#                        never silently move a session onto another model.
#   orchestrator       -> LEGACY driver name, same backend as `heavy`, its own
#                        id so metrics never conflate the two, kept resolving
#                        so a session pinned to the old name mid-run does not
#                        404 after a rename.
#   flash              -> WORKER: cheap high-volume fan-out lane:
#                        `~google/gemini-flash-latest` via OpenRouter (currently
#                        resolves to Gemini 3.8 Flash). Falls back to `flash-terra`.
#   super-flash        -> HOUSEKEEPER: title / summary / compaction only. Same
#                        model as `flash`, its own deployment so compaction
#                        never queues behind a fan-out — at the LOWEST
#                        reasoning effort the model will accept. Falls back to
#                        `super-flash-luna` ONLY when it errors.
#   super-flash-luna   -> `super-flash`'s fallback hop: GPT-5.6 Luna via
#                        OpenRouter, with reasoning turned OFF.
#   local-orch         -> the host GPU's "smart" model, via mlx_vlm.server on :8092
#   local-sub          -> the host GPU's cheap fan-out model, via mlx_vlm.server on :8093
#
# TWO cloud roles beyond the driver, not one. The housekeeper is split out from
# the worker because those two agents behave nothing like a fan-out: they fire
# on their own schedule, and a compaction call carries the ENTIRE transcript.
# Pointing them at the worker lane makes them queue behind whatever the fan-out
# is doing, on the lane least likely to have headroom. On the GPU pair there is
# no third lane, so the housekeeper shares local-sub.
#
# NO FALLBACK CHAINS on the driver, deliberately simplified: a driver that
# fails must error loudly rather than have litellm silently move a live session
# onto a different model mid-run. The two Gemini worker lanes keep exactly ONE
# hop each, to an upstream-independent model via OpenRouter, so a fan-out or a
# compaction call survives a Gemini outage without the driver's identity ever
# moving.
#
# Do NOT rebuild a multi-project Gemini key pool: limits are per Google Cloud
# project, and spreading load across projects to multiply them violates Google
# APIs ToS §2.d ("you will not attempt to circumvent such limitations"; beyond-
# limit use requires Google's EXPRESS consent) — nine burst-created projects
# were suspended for exactly this in one night on 2026-08-25, deleted, and the
# account's OAuth APIs were restricted. OpenRouter serves Gemini under its OWN
# upstream agreement, with zero linkage to that Google account, which is why
# `flash` / `super-flash` route through OpenRouter instead of a direct key.
#
# First run of `ferry up` copies this file to ~/.config/ferry/litellm.yaml.
# Edit THAT copy, then export the API keys it references (in your shell or
# ~/.config/ferry/secrets.env). Never commit real keys.
#
# Launch:  ferry up                 # GPU lanes + this config = every lane
#          ferry up --route         # this config alone (cloud lanes only)
#          ferry reload             # re-read this file, GPU lanes stay warm
# ---------------------------------------------------------------------------

model_list:
  # -- Driver lane: the big planning/driving model, via a ChatGPT SUBSCRIPTION
  # (example: GPT-5.6 Sol) ------------------------------------------------
  # Auth is a device-code login at ~/.config/litellm/chatgpt/auth.json (NOT
  # OPENAI_API_KEY, which is pay-per-token) — this draws on a ChatGPT PLAN
  # rather than metered OpenAI billing, so `api_key` below is a
  # required-but-ignored placeholder. The `responses/` segment scopes litellm's
  # Chat->Responses bridge to this deployment so clients keep using the normal
  # /v1/chat/completions shape.
  #
  # STREAMING-ONLY (verified litellm 1.99.0, 2026-09-04): the backend always
  # streams and the bridge only reassembles a reply on the streaming path. A
  # STREAMED call returns 200 (opencode and every agentic client streams by
  # default). A NON-STREAMED call hits a litellm bug ("Unknown items in
  # responses API response: []", HTTP 500) — and with no fallback chain, the
  # caller sees that 500 directly. Probe this lane with `"stream": true`.
  #
  # TOKEN TRAP (verified 2026-09-04): litellm trusts `expires_at` in
  # ~/.config/litellm/chatgpt/auth.json and never refreshes on a server-side
  # 401 `token_expired`. If a lane 401s while the file still says valid, force
  # a refresh through litellm's own authenticator (refresh tokens ROTATE, so
  # the old file is dead once you do this). Write the command with a GENERIC
  # interpreter path — NEVER a hardcoded `/Users/<you>/...` one:
  #   "$(uv tool dir)/litellm/bin/python" -c 'from litellm.llms.chatgpt.authenticator import Authenticator as A; a=A(); a._refresh_tokens(a._read_auth_file()["refresh_token"])'
  # If the refresh itself fails, `a.get_access_token()` runs the device-code
  # login again.
  #
  # EFFORT (verified 2026-09-04): `xhigh` is the HIGHEST value that reaches
  # this backend. litellm's chat->responses bridge maps `reasoning_effort`
  # through a table that knows only none/minimal/low/medium/high/xhigh and
  # returns None for anything else — so `max` (or a typo) is silently DROPPED
  # and the lane runs at the backend's own default instead of erroring.
  - model_name: domestic.heavy
    litellm_params:
      model: chatgpt/responses/gpt-5.6-sol
      api_key: "chatgpt-oauth"     # placeholder; the chatgpt provider reads auth.json
      reasoning_effort: xhigh
      timeout: 600
    model_info:
      public: true        # advertised in /v1/models — the canonical driver lane
      id: chatgpt-gpt56-sol-heavy

  # `orchestrator` (and `orch`) deployments DELETED here (fleets, 2026-09-04):
  # a config with a fleet-prefixed lane name (`domestic.heavy` above) makes
  # `discover_fleets` non-empty, and once fleets exist the front door's
  # LEGACY_HEAVY map resolves both legacy names to `heavy` in code — no
  # deployment block required. See README.md's Fleets section.

  # -- Worker lane: cheap high-volume fan-out (example: Gemini 3.8 Flash via
  # OpenRouter) -------------------------------------------------------------
  # OPENROUTER HOPS ROUTE BY THROUGHPUT, NOT BY DEFAULT. One OpenRouter model
  # id is served by many providers (GLM 5.3 Flash by 22 on 2026-09-02,
  # spanning 111 tok/s at the top and 17 at the bottom), and OpenRouter's
  # DEFAULT picks among the cheapest of them weighted by inverse-square price
  # — so with no preference stated the request lands on the cheapest provider,
  # not the fastest. The `extra_body.provider` block below is OpenRouter's own
  # provider-routing object, forwarded verbatim by litellm's openrouter
  # transform (llms/openrouter/chat/transformation.py, `response.update(
  # extra_body)`, verified 1.97.0/1.99.0). `sort: throughput` re-ranks every
  # request by each provider's p50 tokens/s over a rolling 5-minute window, ON
  # OPENROUTER'S SIDE — nothing here polls, caches, or pins a provider name,
  # so a provider that is rate-limited or down this minute is simply not at
  # the top this minute. (Verified 2026-09-02: pinning `order: ["Baseten"]` —
  # the fastest provider on the page — returned 429 "temporarily
  # rate-limited upstream"; `sort: throughput` on the same model was served by
  # Fireworks at once.) This has to be on EVERY openrouter/ deployment in this
  # file, INCLUDING the Luna hops below: a deployment that lacks it silently
  # lands on whichever provider is cheapest, and nothing downstream can tell.
  #
  # No `api_base`: litellm's `openrouter/` provider already knows the endpoint.
  - model_name: domestic.flash
    litellm_params:
      model: openrouter/~google/gemini-flash-latest
      api_key: os.environ/OPENROUTER_API_KEY
      timeout: 600
      extra_body:
        provider:
          sort: throughput    # fastest provider this minute, ranked by OpenRouter
        reasoning:
          effort: xhigh
    model_info:
      public: true        # advertised in /v1/models
      # ONE `model_info:` key per deployment. YAML silently keeps the LAST
      # duplicate, so a second block pasted in during an edit does not merge
      # and does not error — it REPLACES the id. Hit 2026-08-26: a deployment
      # carrying two model_info blocks answered /v1/model/info with its
      # fallback's id, folding two distinct series into one on every panel
      # grouped by model_id. Nothing warns you; check /v1/model/info after any
      # edit here. model_info.id also gives a deployment a STABLE,
      # human-readable label for the per-deployment Grafana metrics (instead
      # of an opaque hash that changes whenever the key value changes) — ids
      # must stay unique across the whole model_list.
      id: or-gemini-flash

  # -- super-flash: the HOUSEKEEPER lane (title / summary / compaction) ------
  # Same model as `flash`, its own deployment and cooldown, so compaction
  # never queues behind a worker fan-out — a compaction call carries the
  # WHOLE transcript. A real model_name (not an alias) so it stays a distinct
  # id in the metrics; see the model_group_alias warning near the bottom of
  # this file for why an alias would be the wrong tool here.
  #
  # `public: true` is NOT decoration. Omit it and the lane still ROUTES
  # perfectly, but it vanishes from /v1/models, because `ferry up` serves
  # litellm through a filter (front/ferry_front.py) that trims the catalogue
  # to the marked lanes. Every catalogue consumer then reports the lane
  # missing while calls to it keep succeeding — a disagreement nothing
  # reconciles for you. That happened on this host on 2026-08-30: host-reset
  # .sh's verifier failed with "super-flash NOT served" for a lane that
  # answered a probe correctly on the next line. Mark every LANE; never mark a
  # fallback hop (see `flash-terra` / `super-flash-luna` below).
  #
  # REASONING FLOOR (verified 2026-09-04): compaction wants NO thinking, but
  # Gemini Flash refuses to switch it off — through OpenRouter, effort
  # `none`, `max_tokens: 0`, and `enabled: false` all 400 with "Reasoning is
  # mandatory for this endpoint and cannot be disabled". `minimal` is the
  # LOWEST value it accepts. Sent as OpenRouter's own native `reasoning`
  # object (not litellm's `reasoning_effort`) so no provider mapping sits in
  # between.
  - model_name: domestic.super-flash
    litellm_params:
      model: openrouter/~google/gemini-flash-latest
      api_key: os.environ/OPENROUTER_API_KEY
      timeout: 600
      extra_body:
        provider:
          sort: throughput    # fastest provider this minute, ranked by OpenRouter
        reasoning:
          effort: minimal     # the floor Gemini Flash accepts; see note above
    model_info:
      public: true        # advertised in /v1/models
      id: or-gemini-sf

  # -- Fallback hops: Terra for flash, Luna for super-flash, ONLY on error ---
  # One hop per Gemini lane, each its own model_name wired into
  # router_settings.fallbacks below (litellm fallbacks are non-transitive and
  # keyed by the RAW client-supplied model string, not by any alias — see the
  # alias warning further down). Example backend: GPT-5.6 Luna via OpenRouter,
  # chosen over the ChatGPT subscription (`heavy`'s backend) for four reasons:
  # upstream-independent of Gemini, serves NON-streamed calls (the chatgpt/
  # bridge 500s on those, and a compaction fallback that only survives
  # streamed calls is a weak safety net), does not draw on the driver's own
  # subscription bucket, and bills only when a hop actually fires
  # (pay-per-token, no idle cost). Not `public`: a hop routes by name but must
  # never be advertised — a client that selects a hop directly gets no
  # failover behind IT.
  - model_name: domestic.super-flash-luna
    litellm_params:
      model: openrouter/openai/gpt-5.6-luna
      api_key: os.environ/OPENROUTER_API_KEY
      timeout: 600
      extra_body:
        provider:
          sort: throughput    # fastest provider this minute, ranked by OpenRouter
        reasoning:
          effort: none        # the housekeeper's own depth: reasoning OFF
    model_info:
      id: or-luna-sf-fb

  - model_name: domestic.flash-terra
    litellm_params:
      model: openrouter/openai/gpt-5.6-terra
      api_key: os.environ/OPENROUTER_API_KEY
      timeout: 600
      extra_body:
        provider:
          sort: throughput
        reasoning:
          effort: xhigh
    model_info:
      id: or-terra-flash-fb

  # -- LOCAL GPU lanes: the host's own MLX models, addressable by name ---------
  # `ferry up` launches one mlx_vlm.server per lane on an internal loopback port
  # and these two deployments front them, so a GPU model is just another lane on
  # the same endpoint as the cloud ones. Three things matter here:
  #
  #   1. The string after `openai/` is sent to the backend VERBATIM and MUST be
  #      the exact HuggingFace id mlx_vlm preloaded — that is what hits the warm
  #      model cache instead of triggering a fresh load (or a download).
  #   2. `api_key` is a required-but-unused placeholder: mlx_vlm.server runs
  #      without --api-key, but litellm's openai provider demands the field.
  #   3. `timeout` overrides the global request_timeout, because a cold
  #      deep-context prefill on-GPU can legitimately outrun 600s.
  #
  # NO fallback is wired for either local lane, deliberately: the point of asking
  # for a local lane is that the request stays on this machine, so a dead GPU lane
  # must surface as an error rather than silently spending a cloud quota.
  #
  # These lanes stay listed even when the GPU servers are not running (e.g. under
  # `ferry up --route`); calls to them simply fail until the backend is up.
  - model_name: local-orch
    litellm_params:
      model: openai/mlx-community/Qwen3.8-27B-nvfp4
      api_base: http://127.0.0.1:8092/v1
      api_key: "local"
      timeout: 1800
    model_info:
      public: true        # advertised in /v1/models
      id: local-orch-mlx

  - model_name: local-sub
    litellm_params:
      model: openai/mlx-community/NVIDIA-Nemotron-3-Nano-30B-A3B-NVFP4
      api_base: http://127.0.0.1:8093/v1
      api_key: "local"
      timeout: 1800
    model_info:
      public: true        # advertised in /v1/models
      id: local-sub-mlx

general_settings:
  # Shared static key every client must present (Authorization: Bearer ...).
  # Lives in ~/.config/ferry/secrets.env as: export LITELLM_MASTER_KEY=sk-...
  # host-reset.sh's os.environ validator fails closed if it is unset.
  master_key: os.environ/LITELLM_MASTER_KEY

litellm_settings:
  # Exposes litellm-native /metrics on :8090 (per-model usage, per-deployment
  # success/failure, fallback events) for the Grafana stack. Requires the
  # `prometheus_client` dep (bundled by `ferry install`).
  callbacks: ["prometheus"]
  drop_params: true    # DROP provider-unsupported params (e.g. tool_choice, which every
                       # agentic client sends) instead of erroring. Without this, a
                       # provider whose litellm capability map lacks tool_choice raises
                       # UnsupportedParamsError on EVERY tool-using call, and the lane
                       # falls through to a slower hop for no real reason.
  num_retries: 3
  request_timeout: 600

router_settings:
  # Lane names above are real `model_name` deployments in model_list, NOT
  # model_group_alias entries: litellm looks up fallbacks by the RAW client-
  # supplied model string BEFORE alias resolution (router.py:6411), so an
  # alias would lose any chain added later. Keep that shape if you add one.
  routing_strategy: usage-based-routing-v2   # route to the least-used deployment (even
                                             # split); a no-op while each lane is a single
                                             # deployment, harmless if a lane ever grows a pool
  allowed_fails: 3                           # tolerate a few 429s before cooling a
                                             # deployment out — matters for a SOLE fallback
                                             # that has no sibling to roll to
  cooldown_time: 5                           # short cooldown so a cooled deployment recovers
                                             # fast; one 429 can't lock out the only path for
                                             # a full minute
  num_retries: 1                             # retry a failed call once, THEN fall back.
                                              # Keep low: if a hard-down primary returns an
                                              # error litellm maps to a retryable class (e.g.
                                              # a quota 403 -> APIConnectionError), a high
                                              # num_retries adds retry-backoff latency before
                                              # the fallback fires. 1 keeps a worker lane
                                              # resilient to a blip without that penalty.
                                              # (litellm docs rank num_retries: request header
                                              # > request body > deployment litellm_params >
                                              # this litellm_settings default — so this value is
                                              # what a naive config inherits; keep it low or a
                                              # dead primary burns backoff before every hop.)

  # Size the prompt LOCALLY before sending (litellm docs: pre-call checks).
  # An over-context call is rejected or redirected in milliseconds instead of a
  # full provider round-trip -> retry -> fallback chain on a 600s timeout.
  # Enforced against `model_info.max_input_tokens` (litellm docs require both
  # this flag AND the per-deployment cap — without the cap the check can't know
  # the limit) plus litellm's built-in model map. Costs one local token-count
  # pass per call; set the cap explicitly on every lane you want enforced.
  enable_pre_call_checks: true

  # Optional back-compat: if you rename a lane, alias the OLD name to the new one
  # so clients wired before the rename keep working. `hidden: true` keeps the alias
  # OUT of /v1/models while the old id still resolves instead of 404-ing
  # mid-session.
  #
  # `hidden` applies to ALIASES ONLY. litellm consults it in exactly two places,
  # both of them iterating model_group_alias (router.py); a deployment's
  # model_info is never checked for it, and there is no supported way to hide a
  # real `model_name` from /v1/models. So the raw catalogue advertises every
  # deployment below, INCLUDING the fallback hops — and a client that selects a
  # hop directly gets no failover at all, because router_settings.fallbacks is
  # keyed by model group and a hop has no entry of its own.
  #
  # That is what `model_info: {public: true}` above is for: `ferry up` serves
  # litellm through a filter (front/ferry_front.py) that trims /v1/models to the
  # marked lanes. Mark a LANE; never mark a fallback hop.
  #
  # NEVER alias a lane to the name of the model currently behind it. The first
  # time you re-point that lane, every client still sending the old id is served
  # a different model under the old name — and `hidden: true` means /v1/models
  # shows nothing amiss. Alias to a ROLE; a role survives the model changing.
  # (This is exactly why `orchestrator` above is a real deployment with its own
  # `model_info.id`, not an alias to `heavy`.)
  #
  # ⚠ AN ALIAS HAS NO FALLBACK CHAIN. Use one ONLY for a lane you are content to
  # see hard-fail. litellm reads the fallbacks map with the RAW model string the
  # client sent, BEFORE resolving aliases —
  #
  #     router.py:6411   model_group = kwargs.get("model")      # "orchestrator"
  #     router.py:6345   get_fallback_model_group(fallbacks, model_group)
  #     router.py:6357   fallback_model_group is None -> raise original_exception
  #
  # while alias -> target resolution lives at router.py:9278, on the
  # deployment-selection path the lookup above never reaches. So an aliased lane
  # matches no entry, and its primary's error goes straight to the client with the
  # whole chain skipped. Verified 2026-08-28 on a live stack whose primary was
  # quota-blocked: the alias returned 500, the real `model_name` returned 200 from
  # the second hop.
  #
  # This bit hardest on the housekeeping lane. Aliasing `super-flash` looked free
  # and cost it every fallback it appeared to have — and a failed compaction call
  # does not just retry, it drops the whole transcript.
  #
  # So: give a lane a real `model_name` and its own `fallbacks:` entry. To keep it
  # out of the catalogue, just OMIT `model_info: {public: true}` — ferry_front.py
  # advertises only the marked lanes, which is why the "no supported way to hide a
  # real model_name" caveat above applies to raw litellm and not to `ferry up`.
  # A legacy name is duplicated the same way: a real deployment plus its own
  # identical fallbacks entry, never an alias.
  #
  # model_group_alias:
  #   old-name: {model: "heavy", hidden: true}   # resolves, but WITHOUT heavy's chain

  # SIMPLIFIED shape: no fallback chain on the driver lane (`domestic.heavy`,
  # or the `orch`/`orchestrator` names it resolves from) or either local lane —
  # each is ONE deployment by design and must ERROR, not spill onto a
  # different model, when it fails. The two Gemini worker lanes each get
  # exactly ONE hop — `domestic.flash` to Terra, `domestic.super-flash` to
  # Luna — so a fan-out or a compaction call survives a Gemini outage. litellm
  # fallbacks are single-hop (not transitive): the fallback target's own
  # fallback list is never chained in, and neither hop has one of its own.
  # Lane names are fleet-prefixed since 2026-09-04 — see README.md's Fleets
  # section — so a second fleet added to this file would repeat this whole
  # block under an `<other-fleet>.` prefix, never editing these entries in
  # place.
  fallbacks: [{"domestic.flash": ["domestic.flash-terra"]}, {"domestic.super-flash": ["domestic.super-flash-luna"]}]
