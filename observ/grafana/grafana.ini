; ferry observability stack — Grafana OSS config
; Grafana 13.2.0. Runs on port 3001 (not Grafana's default 3000) so it can coexist on this Mac
; with the g0vs1g desk stack, which already occupies 3000/8428/9847. Secrets (admin password,
; etc.) are injected via env at launch — NEVER commit a real value here. The ${...} tokens below
; are materialized by observ/bringup.sh (envsubst, same mechanism as the g0vs1g stack); Grafana
; is always launched pointed at the materialized copy, never at this repo file directly.

[server]
http_port = 3001

[security]
; Default "admin" if GF_SECURITY_ADMIN_USER is unset at materialization time.
admin_user = ${GF_SECURITY_ADMIN_USER}
; Materialized from env at launch (observ/bringup.sh) — never a literal password here.
admin_password = ${GF_SECURITY_ADMIN_PASSWORD}
disable_gravatar = true

[users]
default_theme = dark

[auth.anonymous]
; This is a local-only surface (127.0.0.1, no public exposure), so anonymous access starts
; disabled. Flip to `enabled = true` + `org_role = Viewer` below if no-login local viewing
; is wanted:
;   enabled = true
;   org_role = Viewer
enabled = false

[analytics]
reporting_enabled = false
check_for_updates = false

[unified_alerting]
enabled = true

[alerting]
; Legacy alerting must be off when unified_alerting is on (Grafana 13 requirement).
enabled = false
