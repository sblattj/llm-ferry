# litellm-route-example.yaml — template for `ferry up --route`
# ---------------------------------------------------------------------------
# Serves MULTIPLE models on one OpenAI/Anthropic-compatible endpoint so LAN
# clients (or localhost) get an orchestrator model plus cheaper worker models
# with automatic key failover — all API keys staying on the host.
#
#   orchestrator          -> a "big" planning/driving model (example: Kimi K3)
#   orchestrator-fallback -> an INDEPENDENT model litellm reroutes to when the
#                            orchestrator fails; chain several for depth (example:
#                            Fireworks DeepSeek V4 Pro first, GLM 5.2 last)
#   gemini-3.7-flash      -> worker model, pooled across MULTIPLE API keys
#
# Multi-key pool: the identical `gemini-3.7-flash` deployments below form one
# pool. `usage-based-routing-v2` sends each call to the least-used key
# (proactive even split); on a 429/error litellm retries on another key and
# cools the failed one out for `cooldown_time`.
#
# IMPORTANT: Gemini quota is per-GCP-PROJECT, not per-key — so each key only
# adds real headroom if it lives in its OWN Google Cloud project. Two keys in
# one project share the same quota. Add or remove deployments to match how many
# independent-project keys you actually have.
#
# Orchestrator fallback (strict failover): the `orchestrator-fallback` deployment
# is a SEPARATE model_name, reached ONLY via router_settings.fallbacks when the
# orchestrator errors — a 429, a 5xx, or a hard quota 403. Pick a fallback whose
# capacity is INDEPENDENT of the primary: a different provider or account.
# (Lesson from the field: a fallback that shares a rate-limit bucket with your
# primary — or with your own interactive use of that same account — will 429
# exactly when you need it. A pay-per-token API like Fireworks has its own
# capacity and only bills when the fallback actually fires.)
#
# First run of `ferry up --route` copies this file to ~/.config/ferry/litellm.yaml.
# Edit THAT copy, then export the API keys it references (in your shell or
# ~/.config/ferry/secrets.env). Never commit real keys.
#
# Launch:  ferry up --route            # uses ~/.config/ferry/litellm.yaml
# ---------------------------------------------------------------------------

model_list:
  # -- Orchestrator (example: Kimi K3, an Anthropic-compatible endpoint) -----
  # Swap for any provider. For an Anthropic-format base, litellm appends
  # /v1/messages to api_base. For a plain OpenAI provider, drop api_base and use
  # e.g. `model: openai/<id>` with api_key: os.environ/OPENAI_API_KEY.
  - model_name: orchestrator
    litellm_params:
      model: anthropic/k3-256k
      api_key: os.environ/KIMI_API_KEY
      api_base: https://api.kimi.com/coding      # -> https://api.kimi.com/coding/v1/messages
      timeout: 600

  # -- Orchestrator FALLBACK chain (example: Fireworks DeepSeek V4 Pro, GLM 5.2) --
  # Separate model_names, NOT in any pool — reached only via the `fallbacks:`
  # mapping below when `orchestrator` fails, in the order listed there. Fireworks
  # is a pay-per-token API with its OWN capacity, so it never contends with the
  # primary; billed only when a hop fires. Chain as many as you like, FAST model
  # first and a slower/cheaper one last. Swap for any independent provider/account.
  - model_name: orchestrator-fallback        # 1st fallback: fast
    litellm_params:
      model: fireworks_ai/accounts/fireworks/models/deepseek-v4-pro-0813
      api_key: os.environ/FIREWORKS_API_KEY
      timeout: 600
  - model_name: orchestrator-fallback-2      # last resort: slower/cheaper
    litellm_params:
      model: fireworks_ai/accounts/fireworks/models/glm-5p2
      api_key: os.environ/FIREWORKS_API_KEY
      timeout: 600

  # -- Alternative fallback: a ChatGPT SUBSCRIPTION (not pay-per-token) ---------
  # litellm's native `chatgpt/` provider routes to chatgpt.com/backend-api/codex
  # via a device-code login at ~/.config/litellm/chatgpt/auth.json (NOT
  # OPENAI_API_KEY, which is pay-per-token). The `responses/` segment scopes the
  # chat->responses bridge. NOTE (litellm 1.97.0): STREAMING-ONLY — a streamed
  # /v1/chat/completions works (opencode streams), but a non-streamed call 500s
  # with "Unknown items in responses API response: []" and just rolls to the next
  # fallback. gpt-5.6-sol / gpt-5.4 work; codex-* ids are rejected for ChatGPT accounts.
  # - model_name: orchestrator-fallback
  #   litellm_params:
  #     model: chatgpt/responses/gpt-5.6-sol
  #     api_key: "chatgpt-oauth"     # placeholder; provider reads auth.json
  #     reasoning_effort: max
  #     timeout: 600

  # -- Worker pool: Gemini 3.7 Flash across N keys (each in its OWN project) --
  - model_name: gemini-3.7-flash
    litellm_params:
      model: gemini/gemini-3.7-flash
      api_key: os.environ/GEMINI_API_KEY        # project #1

  - model_name: gemini-3.7-flash
    litellm_params:
      model: gemini/gemini-3.7-flash
      api_key: os.environ/GEMINI_API_KEY_2      # project #2

  - model_name: gemini-3.7-flash
    litellm_params:
      model: gemini/gemini-3.7-flash
      api_key: os.environ/GEMINI_API_KEY_3      # project #3
  - model_name: gemini-3.7-flash
    litellm_params:
      model: gemini/gemini-3.7-flash
      api_key: os.environ/GEMINI_API_KEY_4      # project #4
  - model_name: gemini-3.7-flash
    litellm_params:
      model: gemini/gemini-3.7-flash
      api_key: os.environ/GEMINI_API_KEY_5      # project #5
  # Scale the pool to however many independent-project keys you have — add or
  # delete deployments to match. Each key MUST live in its own Google Cloud
  # project to add real headroom (Gemini quota is per-project, not per-key).
  - model_name: gemini-3.7-flash
    litellm_params:
      model: gemini/gemini-3.7-flash
      api_key: os.environ/GEMINI_API_KEY_6      # project #6

litellm_settings:
  # Exposes litellm-native /metrics on :8090 (per-model usage, per-deployment
  # success/failure, fallback events) for the Grafana stack. Requires the
  # `prometheus_client` dep (bundled by `ferry install`).
  callbacks: ["prometheus"]
  num_retries: 3
  request_timeout: 600

router_settings:
  routing_strategy: usage-based-routing-v2   # route to the least-used key (even split)
  allowed_fails: 3                           # tolerate a few 429s before cooling a
                                             # deployment out — matters for a SOLE fallback
                                             # that has no sibling to roll to
  cooldown_time: 5                           # short cooldown so a cooled deployment (a pool
                                             # key OR the fallback) recovers fast; one 429
                                             # can't lock out the only path for a full minute
  num_retries: 1                             # retry a failed call once, THEN fall back.
                                             # Keep low: if a hard-down primary returns an
                                             # error litellm maps to a retryable class (e.g.
                                             # a quota 403 -> APIConnectionError), a high
                                             # num_retries adds retry-backoff latency before
                                             # the fallback fires. 1 keeps a worker pool
                                             # resilient to a blip without that penalty.
  # Strict failover chain: a failed `orchestrator` reroutes to the fallback list in
  # order (fast model first, last resort last). Only orchestrator has a fallback;
  # the gemini-3.7-flash pool is untouched.
  fallbacks: [{"orchestrator": ["orchestrator-fallback", "orchestrator-fallback-2"]}]
