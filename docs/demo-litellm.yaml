# docs/demo-litellm.yaml — config used ONLY by docs/demo.tape to record the README GIF.
# It is a REAL litellm proxy config, but every model uses litellm's `mock_response`,
# so the demo needs ZERO API keys and makes ZERO network calls — the OpenAI-compatible
# endpoint and the /v1/chat/completions round-trip are genuine, the model replies are canned.
# Mirrors the real ferry shape: one `orchestrator` model + a `gemini-3.7-flash` worker.
model_list:
  - model_name: orchestrator
    litellm_params:
      model: openai/orchestrator
      mock_response: "Ferry online. I'm the orchestrator, served from this one Mac to every device on your LAN through a single OpenAI-compatible endpoint. Your API keys never leave the host."
  - model_name: gemini-3.7-flash
    litellm_params:
      model: openai/gemini-3.7-flash
      mock_response: "gemini-3.7-flash worker here, one of a load-balanced pool of keys living on the host."

litellm_settings:
  drop_params: true
