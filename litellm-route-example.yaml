# litellm-route-example.yaml — template for `ferry up`
# ---------------------------------------------------------------------------
# THE FERRY STACK — several named LANES on one OpenAI/Anthropic-compatible
# endpoint, so LAN clients (or localhost) get a big driving model, a cheap
# high-volume worker pool, and the host's own GPU models — all from one URL,
# with every API key staying on the host.
#
# A lane NAME is the contract clients bind to. The model behind a lane is
# swappable HERE without touching a single client config, which is the whole
# reason the names are roles (`heavy`, `flash`) and not model ids.
#
#   heavy          -> DRIVER: the big planning/driving model (example: Kimi K3)
#   heavy-fallback -> an INDEPENDENT model litellm reroutes to when `heavy` fails;
#                     chain several for depth (example: Fireworks DeepSeek V4 Pro
#                     first, GLM 5.2 last)
#   flash          -> WORKER: cheap high-volume fan-out lane (example: Gemini 3.8
#                     Flash); widen it with MORE MODEL IDS on the SAME key, never
#                     with more keys (see the quota note below)
#   super-flash    -> HOUSEKEEPER: title / summary / compaction only
#   local-orch     -> the host GPU's "smart" model, via mlx_vlm.server on :8092
#   local-sub      -> the host GPU's cheap fan-out model, via mlx_vlm.server on :8093
#
# THREE cloud roles, not two. The housekeeper is split out from the worker
# because those three agents behave nothing like a fan-out: they fire on their
# own schedule, and a compaction call carries the ENTIRE transcript. Pointing
# them at the worker lane makes them queue behind whatever the fan-out is doing,
# on the lane least likely to have headroom. On the GPU pair there is no third
# lane, so the housekeeper shares local-sub.
#
# Worker pool: the template ships `flash` as ONE deployment. Add more deployments
# sharing the `flash` model_name and they form a pool: `usage-based-routing-v2`
# sends each call to the least-used deployment (proactive even split); on a
# 429/error litellm retries on another and cools the failed one out for
# `cooldown_time`. On a single deployment both are a harmless no-op.
#
# WHAT THE POOL MEMBERS MUST BE — read this before adding one. Google's rate-limit
# docs put it verbatim: "Rate limits are applied per project, not per API key."
# Two consequences, and the second one is the whole design of the block below:
#
#   1. A second KEY in the same project buys ZERO extra throughput — it shares one
#      bucket with the first. And a second PROJECT to multiply the limit is
#      circumvention under Google APIs ToS §2.d ("you will not attempt to
#      circumvent such limitations"; beyond-limit use requires Google's EXPRESS
#      consent). Not theoretical: on 2026-08-25 Google Cloud Trust & Safety
#      suspended nine burst-created projects for exactly this in one night,
#      deleted them, and restricted the account's OAuth APIs. ONE project, ONE key.
#
#   2. But the limit is per-project-PER-MODEL: every model id carries its OWN
#      independent RPM / TPM / RPD bucket. So you widen this lane by pooling
#      DIFFERENT MODEL IDS on the SAME key — sanctioned, no second project. Read
#      off one Tier-2 project's rate-limit page (console -> API keys -> rate
#      limits):
#
#          gemini-3.7-flash         2K RPM /  3M TPM / 100K RPD
#          gemini-3.5-flash         2K RPM /  3M TPM / 100K RPD
#          gemini-3.1-flash-lite   10K RPM / 10M TPM / 350K RPD
#
#      Each id is its own bucket, one key, one project. Add a model id and you add
#      a bucket; add a key and you add nothing. The template ships only
#      gemini-3.8-flash (swapped in for 3.7 on 2026-09-02): the two older ids
#      were dropped the same day after a 3-round bench put 3.5 Flash at 37
#      visible tok/s behind ~1000 reasoning tokens per reply. 3.8 Flash is not in
#      the table above because the rate-limit page lists only models with usage;
#      its bucket is ASSUMED to match its 3.7 sibling until it shows a row.
#
# The other sanctioned lever is RAISING THE PAID TIER on that one project, which
# lifts every bucket at once (Tier 3 = 20M TPM for Gemini 3.7 Flash). Beyond that,
# ask Google for a quota increase — ToS §2.d's own escape hatch. Deployments from a
# genuinely different PROVIDER or ACCOUNT (Fireworks beside Gemini) are fine too; a
# second billing account under the same Google account buys nothing.
#
# Driver fallback (strict failover): the `heavy-fallback` deployment is a
# SEPARATE model_name, reached ONLY via router_settings.fallbacks when `heavy`
# errors — a 429, a 5xx, or a hard quota 403. Pick a fallback whose capacity is
# INDEPENDENT of the primary: a different provider or account.
# (Lesson from the field: a fallback that shares a rate-limit bucket with your
# primary — or with your own interactive use of that same account — will 429
# exactly when you need it. A pay-per-token API like Fireworks has its own
# capacity and only bills when the fallback actually fires.)
#
# First run of `ferry up` copies this file to ~/.config/ferry/litellm.yaml.
# Edit THAT copy, then export the API keys it references (in your shell or
# ~/.config/ferry/secrets.env). Never commit real keys.
#
# Launch:  ferry up                 # GPU lanes + this config = every lane
#          ferry up --route         # this config alone (cloud lanes only)
# ---------------------------------------------------------------------------

model_list:
  # -- heavy: the driving model (example: Kimi K3, an Anthropic-compatible endpoint) --
  # Swap for any provider. For an Anthropic-format base, litellm appends
  # /v1/messages to api_base. For a plain OpenAI provider, drop api_base and use
  # e.g. `model: openai/<id>` with api_key: os.environ/OPENAI_API_KEY.
  - model_name: heavy
    litellm_params:
      model: anthropic/k3
      api_key: os.environ/KIMI_API_KEY
      api_base: https://api.kimi.com/coding      # -> https://api.kimi.com/coding/v1/messages
      reasoning_effort: max        # drop_params:true below drops this where a provider rejects it
      timeout: 600
    model_info:
      public: true        # advertised in /v1/models - see the super-flash note
      id: kimi-k3-heavy

  # -- heavy FALLBACK chain (example: Fireworks DeepSeek V4 Pro, GLM 5.2) -----
  # Separate model_names, NOT in any pool — reached only via the `fallbacks:`
  # mapping below when `heavy` fails, in the order listed there. Fireworks is a
  # pay-per-token API with its OWN capacity, so it never contends with the
  # primary; billed only when a hop fires. Chain as many as you like, FAST model
  # first and a slower/cheaper one last. Swap for any independent provider/account.

  - model_name: heavy-fallback                # 1st fallback: fast
    litellm_params:
      model: fireworks_ai/accounts/fireworks/models/deepseek-v4-pro-0813
      api_key: os.environ/FIREWORKS_API_KEY
      reasoning_effort: max
      timeout: 600
    model_info:
      # No `public: true` — a hop must stay out of the catalogue. It still wants
      # an id: without one litellm labels its metrics with a hash that changes
      # every time this file is edited, so a Grafana panel loses the series.
      id: fw-deepseek-v4pro
  - model_name: heavy-fallback-2              # last resort: slower/cheaper
    litellm_params:
      model: fireworks_ai/accounts/fireworks/models/glm-5p2
      api_key: os.environ/FIREWORKS_API_KEY
      reasoning_effort: max
      timeout: 600
    model_info:
      id: fw-glm-5p2

  # -- Alternative fallback: a ChatGPT SUBSCRIPTION (not pay-per-token) ---------
  # litellm's native `chatgpt/` provider routes to chatgpt.com/backend-api/codex
  # via a device-code login at ~/.config/litellm/chatgpt/auth.json (NOT
  # OPENAI_API_KEY, which is pay-per-token). The `responses/` segment scopes the
  # chat->responses bridge. NOTE (litellm 1.97.0): STREAMING-ONLY — a streamed
  # /v1/chat/completions works (opencode streams), but a non-streamed call 500s
  # with "Unknown items in responses API response: []" and just rolls to the next
  # fallback. gpt-5.6-sol / gpt-5.4 work; codex-* ids are rejected for ChatGPT accounts.
  # - model_name: heavy-fallback
  #   litellm_params:
  #     model: chatgpt/responses/gpt-5.6-sol
  #     api_key: "chatgpt-oauth"     # placeholder; provider reads auth.json
  #     reasoning_effort: max
  #     timeout: 600

  # -- flash: worker lane. ONE Google project, ONE key, MANY models. -----------
  # model_info.id gives the deployment a STABLE, human-readable id. litellm stamps
  # it onto the `model_id` label of the per-deployment metrics, so Grafana panels
  # can name the key instead of an opaque hash (which also changes whenever the
  # key value changes). Ids must be unique across the whole model_list.
  #
  # ONE `model_info:` key per deployment. YAML silently keeps the LAST duplicate,
  # so a second block pasted in during an edit does not merge and does not error
  # — it REPLACES the id. Hit 2026-08-26: a `flash` deployment carrying two
  # model_info blocks answered /v1/model/info with its own FALLBACK's id, so
  # every panel grouped by model_id folded the primary and the fallback into one
  # series — exactly the split those panels exist to show. Nothing warns you;
  # check /v1/model/info after any edit here.
  #
  # ONE deployment, ONE api_key. To widen it, add more deployments with the SAME
  # `flash` model_name and DIFFERENT model ids on this same key: rate limits are
  # per-project and per-MODEL, never per-key (see the note at the top of this
  # file), so each id is an independent RPM/TPM/RPD bucket. The old template
  # shipped a `# project #1 … # project #6` pool of keys, one key minted per
  # Google Cloud project — that bought real throughput and was a Google APIs
  # ToS §2.d violation, and nine of those projects were suspended in one night on
  # 2026-08-25. More model ids on one key is the legitimate route to the same
  # headroom: nothing to circumvent.
  #
  # Pick pool members that are interchangeable for the lane's ROLE — cheap fast
  # workers, so a caller cannot tell which one answered, which is the only reason
  # a pool is allowed to round-robin across them at all. Do NOT pool a frontier
  # model with a lite one just to add a bucket: the lane's behaviour would change
  # per request. Verify a new id serves your key first (see the README) — and
  # never add another project's key.
  - model_name: flash
    litellm_params:
      model: gemini/gemini-3.8-flash
      api_key: os.environ/GEMINI_API_KEY      # ONE key, one project
    model_info:
      public: true        # advertised in /v1/models
      id: gemini-flash-38

  # -- super-flash: the HOUSEKEEPER lane --------------------------------------
  # title / summary / compaction only. It gets its own lane rather than sharing
  # `flash` because those agents fire on their own schedule and a compaction call
  # carries the whole transcript — they should not queue behind a fan-out. Any
  # cheap fast model does; it need not match what `flash` runs.
  #
  # `public: true` is NOT decoration. Omit it and the lane still ROUTES perfectly,
  # but it vanishes from /v1/models, because `ferry up` serves litellm through a
  # filter (front/ferry_front.py) that trims the catalogue to the marked lanes.
  # Every catalogue consumer then reports the lane missing while calls to it keep
  # succeeding — a disagreement nothing reconciles for you. That happened on this
  # host on 2026-08-30: host-reset.sh's verifier failed with "super-flash NOT
  # served" for a lane that answered a probe correctly on the next line.
  # Mark every LANE; never mark a fallback hop.
  #
  # OPENROUTER HOPS ROUTE BY THROUGHPUT. One OpenRouter model id is served by
  # many providers (GLM 5.3 Flash by 22 on 2026-09-02, spanning 111 tok/s at
  # the top and 17 at the bottom), and OpenRouter's DEFAULT picks among the
  # cheapest of them weighted by inverse-square price — so with no preference
  # stated the request lands on the cheapest provider, not the fastest. The
  # `extra_body.provider` block below is OpenRouter's own provider-routing
  # object, forwarded verbatim by litellm's openrouter transform
  # (llms/openrouter/chat/transformation.py, `response.update(extra_body)`,
  # verified 1.97.0). `sort: throughput` re-ranks every request by each
  # provider's p50 tokens/s over a rolling 5-minute window, ON OPENROUTER'S
  # SIDE — nothing here polls, caches, or pins a provider name, so a provider
  # that is rate-limited or down this minute is simply not at the top this
  # minute. (Verified 2026-09-02: pinning `order: ["Baseten"]` — the fastest
  # provider on the page — returned 429 "temporarily rate-limited upstream";
  # `sort: throughput` on the same model was served by Fireworks at once.)
  #
  # The trade: throughput sort ignores price. Where a discounted provider is
  # the cheap one, this can land on a full-price one instead (GLM 5.3 Flash:
  # $0.25/M out discounted vs $0.50/M full). Drop the block from a deployment
  # you would rather run cheap than fast. On a single-provider model (Gemini
  # via OpenRouter) it is inert either way.
  - model_name: super-flash
    litellm_params:
      model: openrouter/google/gemini-3.8-flash
      api_key: os.environ/OPENROUTER_API_KEY
      timeout: 600
      extra_body:
        provider:
          sort: throughput    # fastest provider this minute, ranked by OpenRouter
    model_info:
      public: true        # advertised in /v1/models
      id: or-gemini-sf

  # -- LOCAL GPU lanes: the host's own MLX models, addressable by name ---------
  # `ferry up` launches one mlx_vlm.server per lane on an internal loopback port
  # and these two deployments front them, so a GPU model is just another lane on
  # the same endpoint as the cloud ones. Three things matter here:
  #
  #   1. The string after `openai/` is sent to the backend VERBATIM and MUST be
  #      the exact HuggingFace id mlx_vlm preloaded — that is what hits the warm
  #      model cache instead of triggering a fresh load (or a download).
  #   2. `api_key` is a required-but-unused placeholder: mlx_vlm.server runs
  #      without --api-key, but litellm's openai provider demands the field.
  #   3. `timeout` overrides the global request_timeout, because a cold
  #      deep-context prefill on-GPU can legitimately outrun 600s.
  #
  # NO fallback is wired for either local lane, deliberately: the point of asking
  # for a local lane is that the request stays on this machine, so a dead GPU lane
  # must surface as an error rather than silently spending a cloud quota.
  #
  # These lanes stay listed even when the GPU servers are not running (e.g. under
  # `ferry up --route`); calls to them simply fail until the backend is up.
  - model_name: local-orch
    litellm_params:
      model: openai/mlx-community/Qwen3.8-27B-nvfp4
      api_base: http://127.0.0.1:8092/v1
      api_key: "local"
      timeout: 1800
    model_info:
      public: true        # advertised in /v1/models
      id: local-orch-mlx

  - model_name: local-sub
    litellm_params:
      model: openai/mlx-community/NVIDIA-Nemotron-3-Nano-30B-A3B-NVFP4
      api_base: http://127.0.0.1:8093/v1
      api_key: "local"
      timeout: 1800
    model_info:
      public: true        # advertised in /v1/models
      id: local-sub-mlx

general_settings:
  # Shared static key every client must present (Authorization: Bearer ...).
  # Lives in ~/.config/ferry/secrets.env as: export LITELLM_MASTER_KEY=sk-...
  # host-reset.sh's os.environ validator fails closed if it is unset.
  master_key: os.environ/LITELLM_MASTER_KEY

litellm_settings:
  # Exposes litellm-native /metrics on :8090 (per-model usage, per-deployment
  # success/failure, fallback events) for the Grafana stack. Requires the
  # `prometheus_client` dep (bundled by `ferry install`).
  callbacks: ["prometheus"]
  drop_params: true    # DROP provider-unsupported params (e.g. tool_choice, which every
                       # agentic client sends) instead of erroring. Without this, a
                       # provider whose litellm capability map lacks tool_choice raises
                       # UnsupportedParamsError on EVERY tool-using call, and the lane
                       # falls through to a slower hop for no real reason.
  num_retries: 3
  request_timeout: 600

router_settings:
  routing_strategy: usage-based-routing-v2   # route to the least-used key (even split)
  allowed_fails: 3                           # tolerate a few 429s before cooling a
                                             # deployment out — matters for a SOLE fallback
                                             # that has no sibling to roll to
  cooldown_time: 5                           # short cooldown so a cooled deployment (a pool
                                             # key OR the fallback) recovers fast; one 429
                                             # can't lock out the only path for a full minute
  num_retries: 1                             # retry a failed call once, THEN fall back.
                                              # Keep low: if a hard-down primary returns an
                                              # error litellm maps to a retryable class (e.g.
                                              # a quota 403 -> APIConnectionError), a high
                                              # num_retries adds retry-backoff latency before
                                              # the fallback fires. 1 keeps a worker pool
                                              # resilient to a blip without that penalty.
                                              # (litellm docs rank num_retries: request header
                                              # > request body > deployment litellm_params >
                                              # this litellm_settings default — so this value is
                                              # what a naive config inherits; keep it low or a
                                              # dead primary burns backoff before every hop.)

  # Size the prompt LOCALLY before sending (litellm docs: pre-call checks).
  # An over-context call is rejected or redirected in milliseconds instead of a
  # full provider round-trip -> retry -> fallback chain on a 600s timeout.
  # Enforced against `model_info.max_input_tokens` (litellm docs require both
  # this flag AND the per-deployment cap — without the cap the check can't know
  # the limit) plus litellm's built-in model map. Costs one local token-count
  # pass per call; set the cap explicitly on every lane you want enforced.
  enable_pre_call_checks: true
  # Fires on ContextWindowExceededError (pre-call OR provider-raised): an
  # oversized prompt reroutes down the chain, exactly like ordinary failures.
  # Point it at fallbacks whose context is at least as large as the primary's.
  context_window_fallbacks: [{"heavy": ["heavy-fallback", "heavy-fallback-2"]}]

  # Optional back-compat: if you rename a lane, alias the OLD name to the new one
  # so clients wired before the rename keep working. `hidden: true` keeps the alias
  # OUT of /v1/models while the old id still resolves instead of 404-ing
  # mid-session.
  #
  # `hidden` applies to ALIASES ONLY. litellm consults it in exactly two places,
  # both of them iterating model_group_alias (router.py); a deployment's
  # model_info is never checked for it, and there is no supported way to hide a
  # real `model_name` from /v1/models. So the raw catalogue advertises every
  # deployment below, INCLUDING the fallback hops — and a client that selects a
  # hop directly gets no failover at all, because router_settings.fallbacks is
  # keyed by model group and a hop has no entry of its own.
  #
  # That is what `model_info: {public: true}` below is for: `ferry up` serves
  # litellm through a filter (front/ferry_front.py) that trims /v1/models to the
  # marked lanes. Mark a LANE; never mark a fallback hop.
  #
  # NEVER alias a lane to the name of the model currently behind it. The first
  # time you re-point that lane, every client still sending the old id is served
  # a different model under the old name — and `hidden: true` means /v1/models
  # shows nothing amiss. Alias to a ROLE; a role survives the model changing.
  #
  # ⚠ AN ALIAS HAS NO FALLBACK CHAIN. Use one ONLY for a lane you are content to
  # see hard-fail. litellm reads the fallbacks map with the RAW model string the
  # client sent, BEFORE resolving aliases —
  #
  #     router.py:6411   model_group = kwargs.get("model")      # "orchestrator"
  #     router.py:6345   get_fallback_model_group(fallbacks, model_group)
  #     router.py:6357   fallback_model_group is None -> raise original_exception
  #
  # while alias -> target resolution lives at router.py:9278, on the
  # deployment-selection path the lookup above never reaches. So an aliased lane
  # matches no entry, and its primary's error goes straight to the client with the
  # whole chain skipped. Verified 2026-08-28 on a live stack whose primary was
  # quota-blocked: the alias returned 500, the real `model_name` returned 200 from
  # the second hop.
  #
  # This bit hardest on the housekeeping lane. Aliasing `super-flash` looked free
  # and cost it every fallback it appeared to have — and a failed compaction call
  # does not just retry, it drops the whole transcript.
  #
  # So: give a lane a real `model_name` and its own `fallbacks:` entry. To keep it
  # out of the catalogue, just OMIT `model_info: {public: true}` — ferry_front.py
  # advertises only the marked lanes, which is why the "no supported way to hide a
  # real model_name" caveat above applies to raw litellm and not to `ferry up`.
  # A legacy name is duplicated the same way: a real deployment plus its own
  # identical fallbacks entry, never an alias.
  #
  # model_group_alias:
  #   old-name: {model: "heavy", hidden: true}   # resolves, but WITHOUT heavy's chain

  # Strict failover chain: a failed `heavy` reroutes to the fallback list in order
  # (fast model first, last resort last).
  #
  # The worker lane has a fallback too: when every `flash` deployment is cooled
  # down (all on 429), overflow reroutes to the model(s) listed instead of
  # returning a raw 429 to the client. Point it at a lane with spare capacity (here
  # `heavy` itself). litellm fallbacks are single-hop (not transitive), so the
  # fallback target's own fallback list is NOT chained in. Remove the second entry
  # if you want `flash` to hard-fail rather than spill over.
  #
  # GIVE THE HOUSEKEEPER A CHAIN TOO. `super-flash` carries compaction, and a
  # failed compaction call does not merely retry — it drops the whole transcript.
  # It is the lane where a missing chain costs the most and announces it least,
  # which is why it is wired below rather than left to hard-fail.
  #
  # Note what is ABSENT: neither local lane appears here. See the deployment
  # comments above for why that is deliberate.
  fallbacks: [{"heavy": ["heavy-fallback", "heavy-fallback-2"]}, {"flash": ["super-flash", "heavy"]}, {"super-flash": ["flash", "heavy"]}]
